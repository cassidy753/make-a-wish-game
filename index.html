<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Make a Wish｜生日故事遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== 標題畫面 ===== -->
  <div id="title-screen" class="screen active">
    <div class="stars"></div>
    <div class="title-card">
      <div class="title-eyebrow" id="title-eyebrow">星際故事圖書館系列</div>
      <h1 class="title-main" id="title-main">童話救援計劃</h1>
      <div class="title-sub" id="title-sub">— Make a Wish —</div>
      <div class="title-btns">
        <button id="btn-new" class="btn btn-gold">⟡ 開始旅程</button>
        <button id="btn-continue" class="btn btn-line" style="display:none">▸ 繼續旅程</button>
      </div>
      <div class="title-note"><span id="gift-share-entry">私人贈禮</span>｜<span id="disclaimer">非商業用途</span></div>
    </div>
  </div>

  <!-- ===== 遊戲畫面 ===== -->
  <div id="game-screen" class="screen">
    <div id="hud">
      <div id="hud-chapter">序章</div>
      <div id="hud-items"></div>
      <button id="btn-skip">⏭ SKIP</button>
      <button id="btn-menu">☰</button>
    </div>

    <div id="stage">
      <div id="bg"></div>
      <div id="particles"></div>
      <div id="fog"></div>
      <div id="portrait-wrap"><img id="portrait" src="assets/belle-rose.webp" alt=""><div id="portrait-label">Belle</div></div>
      <div id="scene-fx"></div>
    </div>

    <div id="dialog">
      <button id="btn-prev" type="button">上一句</button>
      <div id="nameplate"></div>
      <div id="dtext"></div>
      <div id="dnext">▼</div>
    </div>

    <div id="overlay" class="hidden"><div id="overlay-box"></div></div>
    <div id="chapter-card" class="hidden"><div id="chapter-card-inner"></div></div>
  </div>

</div>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/story.js"></script>
<script src="js/engine.js"></script>
<script src="js/story2.js"></script>
<script src="js/engine2.js"></script>
<script src="js/story3.js"></script>
<script src="js/engine3.js"></script>
</body>
</html>
